name: Build NetHunter Kernel Full Package
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-20.04
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Install Build Tools
        run: |
          sudo apt update
          sudo apt install -y build-essential bc bison flex libssl-dev libncurses5-dev gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu git

      - name: Apply NetHunter Full Patches
        run: |
          # 1. Enable Wireless Injection & Drivers
          echo "CONFIG_WIRELESS=y" >> arch/arm64/configs/lineage_defconfig
          echo "CONFIG_CFG80211=y" >> arch/arm64/configs/lineage_defconfig
          echo "CONFIG_MAC80211=y" >> arch/arm64/configs/lineage_defconfig
          echo "CONFIG_CFG80211_WEXT=y" >> arch/arm64/configs/lineage_defconfig
          
          # 2. Enable HID Support (BadUSB)
          sed -i 's/CONFIG_USB_HID=m/CONFIG_USB_HID=y/g' arch/arm64/configs/lineage_defconfig || true
          echo "CONFIG_USB_HIDDEV=y" >> arch/arm64/configs/lineage_defconfig
          
          # 3. Network Injection Patches
          echo "CONFIG_NETFILTER_XT_TARGET_NETMAP=y" >> arch/arm64/configs/lineage_defconfig
          echo "CONFIG_PACKET=y" >> arch/arm64/configs/lineage_defconfig

      - name: Build Kernel
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          
          make lineage_defconfig
          
          # Force build with relaxed flags to bypass compat_binfmt_elf.o errors
          make -j$(nproc) KCFLAGS="-w -fpermissive" HOSTCFLAGS="-w" Image.gz
          
