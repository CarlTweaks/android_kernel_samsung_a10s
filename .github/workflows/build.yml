name: Build Kernel Samsung A10s
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Install Build Tools
        run: |
          sudo apt update
          sudo apt install -y build-essential bc bison flex libssl-dev libncurses5-dev gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu

      - name: Build Kernel
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          
          # Gamitin ang nakita mong defconfig sa README
          make lineage_defconfig
          
          # Heto ang adjustment para sa exit code 2 na nakita mo sa fs/compat_binfmt_elf.o
          make -j$(nproc) KCFLAGS="-w -fpermissive" HOSTCFLAGS="-w" Image.gz
          
